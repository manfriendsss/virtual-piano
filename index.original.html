        progressFill: document.getElementById('progress-fill'),
        progressThumb: document.getElementById('progress-thumb'),
        timeReadout: document.getElementById('time-readout'),

        chordPills: document.getElementById('chord-pills'),
        chordReadout: document.getElementById('chord-notes-readout'),
        clearChordBtn: document.getElementById('clear-chord-btn'),
        playChordBtn: document.getElementById('play-chord-btn'),

        pianoScroll: document.getElementById('piano-scroll'),
        pianoInner: document.getElementById('piano-inner'),
        pianoBed: document.getElementById('piano-bed'),
        whiteKeysLayer: document.getElementById('white-keys-layer'),
        blackKeysLayer: document.getElementById('black-keys-layer'),
        mobileScrollHint: document.getElementById('mobile-scroll-hint'),

        keyByMidi: new Map(),
        songPillById: new Map(),
        chordPillById: new Map(),
        speedBtnByVal: new Map(),
      };

      /* =========================================================================
       * 5. AUDIO ENGINE (Tone.Sampler + Tone.Reverb + Tone.Volume)
       * ========================================================================= */

      let sampler = null;
      let fallbackSynth = null;
      let reverb = null;
      let masterVolume = null;

      function percentToDb(percent) {
        if (percent <= 0) return -Infinity;
        return 20 * Math.log10(percent / 100);
      }

      function setStatusPill(mode, text) {
        dom.statusText.textContent = text;
        dom.statusDot.classList.remove('dot-pulse', 'bg-[#E28C4D]', 'bg-[#6A9E78]', 'bg-[#4E94BE]');
        if (mode === 'loading') {
          dom.statusDot.classList.add('bg-[#E28C4D]', 'dot-pulse');
        } else if (mode === 'ready') {
          dom.statusDot.classList.add('bg-[#6A9E78]');
        } else {
          dom.statusDot.classList.add('bg-[#4E94BE]');
        }
      }

      /**
       * Configures Tone.Sampler with Salamander Grand Piano samples routed through
       * subtle Tone.Reverb (decay: 2.2, wet: 0.18) and Tone.Volume.
       */
      function initAudioEngine() {
        try {
          masterVolume = new Tone.Volume(percentToDb(state.volumePercent)).toDestination();

          reverb = new Tone.Reverb({
            decay: 2.2,
            preDelay: 0.015,
            wet: 0.18,
          }).connect(masterVolume);

          // Gentle PolySynth fallback used only while samples finish loading or offline
          fallbackSynth = new Tone.PolySynth(Tone.Synth, {
            oscillator: { type: 'triangle' },
            envelope: { attack: 0.012, decay: 0.35, sustain: 0.25, release: 1.1 },
            volume: -6,
          }).connect(reverb);

          sampler = new Tone.Sampler({
            urls: SALAMANDER_URLS,
            baseUrl: SALAMANDER_BASE_URL,
            release: 1.15,
            onload: () => {
              state.samplerLoaded = true;
              state.usingFallbackSynth = false;
              setStatusPill('ready', 'Ready');
            },
            onerror: (err) => {
              console.warn('Salamander sample fetch fallback:', err);
              state.usingFallbackSynth = true;
              setStatusPill('fallback', 'Synth Ready');
            },
          }).connect(reverb);
        } catch (err) {
          console.error('Audio initialization error:', err);
          setStatusPill('fallback', 'Audio Unavailable');
        }
      }

      /** Unlocks Web Audio on the first user gesture. */
      function ensureAudioStarted() {
        if (state.audioUnlocked && Tone.context.state === 'running') return;
        try {
          if (Tone.context.state !== 'running') {
            Tone.start().then(() => {
              state.audioUnlocked = true;
            }).catch((err) => {
              console.warn('Tone.start deferred:', err);
            });
          } else {
            state.audioUnlocked = true;
          }
        } catch (err) {
          console.warn('Audio unlock error:', err);
        }
      }

      function audioAttack(note, velocity = 0.82) {
        ensureAudioStarted();
        const now = Tone.now();
        try {
          if (state.samplerLoaded && sampler && !state.usingFallbackSynth) {
            sampler.triggerAttack(note, now, velocity);
          } else if (fallbackSynth) {
            fallbackSynth.triggerAttack(note, now, velocity * 0.78);
          }
        } catch (err) {
          console.warn('Attack error:', err);
        }
      }

      function audioRelease(note) {
        const now = Tone.now();
        try {
          if (state.samplerLoaded && sampler && !state.usingFallbackSynth) {
            sampler.triggerRelease(note, now);
          }
          if (fallbackSynth) {
            fallbackSynth.triggerRelease(note, now);
          }
        } catch (err) {
          console.warn('Release error:', err);
        }
      }

      function audioTriggerScheduled(note, durationSec, time, velocity = 0.80) {
        try {
          if (state.samplerLoaded && sampler && !state.usingFallbackSynth) {
            sampler.triggerAttackRelease(note, durationSec, time, velocity);
          } else if (fallbackSynth) {
            fallbackSynth.triggerAttackRelease(note, durationSec, time, velocity * 0.75);
          }
        } catch (err) {
          console.warn('Scheduled note error:', err);
        }
      }

      /** Immediately silences all ringing & scheduled audio voices. */
      function silenceAllAudio() {
        const now = Tone.now();
        try {
          if (sampler) sampler.releaseAll(now);
          if (fallbackSynth) fallbackSynth.releaseAll(now);
        } catch (err) {
          console.warn('Silence error:', err);
        }
      }

      /* =========================================================================
       * 6. KEYBOARD VISUAL SYNC & ADAPTIVE RENDERER
       * ========================================================================= */

      function getAnchorBaseMidi() {
        return (DEFAULT_BASE_OCTAVE + state.octaveShift + 1) * 12; // 60 = C4
      }

      function getSelectedSong() {
        return SONGS.find((s) => s.id === state.selectedSongId) || null;
      }

      /** Applies all 4 independent state layers onto a single rendered key DOM node. */
      function syncKeyVisual(midi) {
        const el = dom.keyByMidi.get(midi);
        if (!el) return;

        const manualSet = state.manualActive.get(midi);
        el.classList.toggle('is-manual', Boolean(manualSet && manualSet.size > 0));
        el.classList.toggle('is-auto-rh', state.autoRHActive.has(midi));
        el.classList.toggle('is-auto-lh', state.autoLHActive.has(midi));
        el.classList.toggle('is-chord', state.chordHighlight.has(midi));
      }

      /** Re-syncs every currently rendered key. */
      function syncAllVisibleKeys() {
        dom.keyByMidi.forEach((_, midi) => syncKeyVisual(midi));
      }

      /**
       * Computes active visible min/max MIDI range based on Free Play vs Song mode,
       * then builds proportionally spaced white & black keys across that exact span.
       */
      function renderAdaptiveKeyboard() {
        const song = getSelectedSong();
        const anchorMidi = getAnchorBaseMidi();

        if (state.rangeMode === 'song' && song) {
          state.visibleMinMidi = song.rangeMinMidi;
          state.visibleMaxMidi = song.rangeMaxMidi;
        } else {
          state.rangeMode = 'free';
          state.visibleMinMidi = anchorMidi;
          state.visibleMaxMidi = anchorMidi + 23; // 2 full octaves C..B
        }

        // Count white keys and assign sequential white indices
        const whiteMidis = [];
        const midiToWhiteIdx = new Map();
        for (let m = state.visibleMinMidi; m <= state.visibleMaxMidi; m += 1) {
          if (!isBlackMidi(m)) {
            midiToWhiteIdx.set(m, whiteMidis.length);
            whiteMidis.push(m);
          }
        }

        const totalWhiteKeys = whiteMidis.length;
        const whiteKeyWidthPct = 100 / totalWhiteKeys;
        const blackKeyWidthPct = whiteKeyWidthPct * 0.62;
        const isDense = totalWhiteKeys > 18;

        // Smooth horizontal scroll on narrow mobile screens while fitting 100% on desktop
        if (totalWhiteKeys > 14) {
          dom.pianoInner.style.minWidth = `${totalWhiteKeys * 36}px`;
        } else {
          dom.pianoInner.style.minWidth = '100%';
        }

        dom.whiteKeysLayer.innerHTML = '';
        dom.blackKeysLayer.innerHTML = '';
        dom.keyByMidi.clear();

        for (let m = state.visibleMinMidi; m <= state.visibleMaxMidi; m += 1) {
          const noteName = midiToNote(m);
          const pc = ((m % 12) + 12) % 12;
          const isBlack = IS_BLACK_PC[pc];
          const shortcutOffset = m - anchorMidi;
          const shortcut = (shortcutOffset >= 0 && shortcutOffset <= 23)
            ? OFFSET_TO_LABEL.get(shortcutOffset)
            : '';

          const keyEl = document.createElement('button');
          keyEl.type = 'button';
          keyEl.dataset.midi = String(m);
          keyEl.setAttribute('aria-label', noteName);
          keyEl.tabIndex = -1;

          if (!isBlack) {
            keyEl.className = [
              'key-white relative flex-1 h-full rounded-b-lg sm:rounded-b-xl',
              'flex flex-col items-center justify-end pb-2 sm:pb-2.5 px-0.5',
              'cursor-pointer outline-none select-none',
            ].join(' ');

            const noteSizeClass = isDense ? 'text-[9px] sm:text-[11px]' : 'text-[10px] sm:text-xs';
            const shortcutSizeClass = isDense ? 'text-[8px] sm:text-[10px]' : 'text-[9px] sm:text-[11px]';

            keyEl.innerHTML = `
              <span class="chord-dot absolute top-2.5 sm:top-3.5 w-2 h-2 rounded-full bg-[#E28C4D] ring-2 ring-[#FAF8F4]/85 pointer-events-none"></span>
              <span class="key-note-label ${noteSizeClass} font-semibold text-[#2D2B28] leading-none mb-1.5 pointer-events-none">${noteName}</span>
              <span class="key-shortcut-label ${shortcutSizeClass} font-medium text-[#918A7F] leading-none h-3.5 inline-flex items-center px-1 rounded ${shortcut ? 'bg-[#2D2B28]/[0.05]' : 'opacity-0'} pointer-events-none">${shortcut || '·'}</span>
            `;

            dom.whiteKeysLayer.appendChild(keyEl);
          } else {
            // Position black key accurately over the boundary after its preceding white key
            const prevWhiteIdx = midiToWhiteIdx.get(m - 1);
            const anchor = (prevWhiteIdx + 1) + (BLACK_OFFSET_BY_PC[pc] || 0);
            const leftPct = anchor * whiteKeyWidthPct - blackKeyWidthPct / 2;

            keyEl.className = [
              'key-black pointer-events-auto absolute top-0 h-[60%] rounded-b-md sm:rounded-b-lg z-10',
              'flex flex-col items-center justify-end pb-1.5 sm:pb-2 px-0.5',
              'cursor-pointer outline-none select-none',
            ].join(' ');
            keyEl.style.left = `${leftPct}%`;
            keyEl.style.width = `${blackKeyWidthPct}%`;

            const noteSizeClass = isDense ? 'text-[7px] sm:text-[9px]' : 'text-[8px] sm:text-[10px]';
            const shortcutSizeClass = isDense ? 'text-[7px] sm:text-[9px]' : 'text-[8px] sm:text-[10px]';

            keyEl.innerHTML = `
              <span class="chord-dot absolute top-2 sm:top-2.5 w-1.5 h-1.5 rounded-full bg-[#F8F6F2] pointer-events-none"></span>
              <span class="key-note-label ${noteSizeClass} font-medium text-[#E9E3D9] leading-none mb-1 tracking-tighter pointer-events-none">${noteName}</span>
              <span class="key-shortcut-label ${shortcutSizeClass} font-medium text-[#A39C91] leading-none h-3 inline-flex items-center ${shortcut ? '' : 'opacity-0'} pointer-events-none">${shortcut || '·'}</span>
            `;

            dom.blackKeysLayer.appendChild(keyEl);
          }

          dom.keyByMidi.set(m, keyEl);
        }

        updateRangeIndicators();
        recomputeChordHighlights();
        syncAllVisibleKeys();
        updateMobileScrollHint();
      }

      /** Updates octave controls readout, visible range badge, and Free Play button. */
      function updateRangeIndicators() {
        const baseOct = DEFAULT_BASE_OCTAVE + state.octaveShift;
        dom.octaveReadout.textContent = `C${baseOct} – B${baseOct + 1}`;
        dom.octaveDownBtn.disabled = state.octaveShift <= MIN_OCTAVE_SHIFT;
        dom.octaveUpBtn.disabled = state.octaveShift >= MAX_OCTAVE_SHIFT;

        const rangeLabel = `${midiToNote(state.visibleMinMidi)} – ${midiToNote(state.visibleMaxMidi)}`;
        if (state.rangeMode === 'song') {
          dom.visibleRangeText.textContent = `${rangeLabel} (Song Range)`;
          dom.freePlayBtn.classList.remove('hidden');
        } else {
          dom.visibleRangeText.textContent = rangeLabel;
          dom.freePlayBtn.classList.add('hidden');
        }
      }

      function updateMobileScrollHint() {
        requestAnimationFrame(() => {
          const overflows = dom.pianoScroll.scrollWidth > dom.pianoScroll.clientWidth + 6;
          dom.mobileScrollHint.classList.toggle('opacity-100', overflows);
          dom.mobileScrollHint.classList.toggle('opacity-0', !overflows);
        });
      }

      /* =========================================================================
       * 7. MANUAL NOTE & SUSTAIN VOICE MANAGEMENT
       * ========================================================================= */

      function pressManualMidi(sourceId, midi, velocity = 0.84) {
        // Release previous note held by this same source (e.g., mouse glissando)
        if (state.sourceToMidi.has(sourceId)) {
          const prevMidi = state.sourceToMidi.get(sourceId);
          if (prevMidi === midi) return;
          releaseManualSource(sourceId);
        }

        if (state.sustainedMidis.has(midi)) {
          state.sustainedMidis.delete(midi);
        }

        state.sourceToMidi.set(sourceId, midi);

        if (!state.manualActive.has(midi)) {
          state.manualActive.set(midi, new Set());
        }
        state.manualActive.get(midi).add(sourceId);

        const nextHold = (state.manualHoldCount.get(midi) || 0) + 1;
        state.manualHoldCount.set(midi, nextHold);

        syncKeyVisual(midi);
        audioAttack(midiToNote(midi), velocity);
      }

      function releaseManualSource(sourceId) {
        const midi = state.sourceToMidi.get(sourceId);
        if (midi === undefined) return;

        state.sourceToMidi.delete(sourceId);

        const set = state.manualActive.get(midi);
        if (set) {
          set.delete(sourceId);
          if (set.size === 0) state.manualActive.delete(midi);
        }
        syncKeyVisual(midi);

        const nextHold = Math.max(0, (state.manualHoldCount.get(midi) || 1) - 1);
        if (nextHold === 0) {
          state.manualHoldCount.delete(midi);
          if (state.sustainOn) {
            state.sustainedMidis.add(midi);
          } else {
            audioRelease(midiToNote(midi));
          }
        } else {
          state.manualHoldCount.set(midi, nextHold);
        }
      }

      function releaseAllManualInputs() {
        const ids = Array.from(state.sourceToMidi.keys());
        ids.forEach((id) => releaseManualSource(id));
        state.activePointers.clear();
      }

      function flushSustainedNotes() {
        state.sustainedMidis.forEach((midi) => {
          if (!state.manualHoldCount.has(midi)) {
            audioRelease(midiToNote(midi));
          }
        });
        state.sustainedMidis.clear();
      }

      /* =========================================================================
       * 8. AUTO-PLAY LOOKAHEAD SCHEDULER (requestAnimationFrame + Tone.now())
       * ========================================================================= */

      const LOOKAHEAD_SEC = 0.12;

      function getSongBeatsPerSec(song) {
        return (song.bpm / 60) * state.playbackSpeed;
      }

      function clearAutoHighlights() {
        const affected = new Set([...state.autoRHActive, ...state.autoLHActive]);
        state.autoRHActive.clear();
        state.autoLHActive.clear();
        affected.forEach((midi) => syncKeyVisual(midi));
      }

      /** Updates the visual progress bar and elapsed / total time readout. */
      function updateProgressUI() {
        const song = getSelectedSong();
        if (!song) {
          dom.progressFill.style.width = '0%';
          dom.progressThumb.style.left = '0%';
          dom.progressTrack.setAttribute('aria-valuenow', '0');
          dom.timeReadout.textContent = '0:00 / 0:00';
          return;
        }

        const ratio = Math.max(0, Math.min(1, state.songPosBeats / song.totalBeats));
        const pct = ratio * 100;
        dom.progressFill.style.width = `${pct}%`;
        dom.progressThumb.style.left = `${pct}%`;
        dom.progressTrack.setAttribute('aria-valuenow', String(Math.round(pct)));

        const bps = getSongBeatsPerSec(song);
        const elapsedSec = state.songPosBeats / bps;
        const totalSec = song.totalBeats / bps;
        dom.timeReadout.textContent = `${formatTime(elapsedSec)} / ${formatTime(totalSec)}`;
      }

      function updateTransportUI() {
        const hasSong = Boolean(getSelectedSong());
        dom.playIcon.classList.toggle('hidden', state.isPlaying);
        dom.pauseIcon.classList.toggle('hidden', !state.isPlaying);
        dom.songPlayLabel.textContent = state.isPlaying ? 'Pause' : 'Play';
        dom.songStopBtn.disabled = !hasSong || (!state.isPlaying && state.songPosBeats <= 0);
      }

      /** Synchronizes visual RH and LH key states deterministically from songPosBeats. */
      function syncAutoVisualsForBeat(song, currentBeat) {
        const nextRH = new Set();
        const nextLH = new Set();

        const events = song.events;
        for (let i = 0; i < events.length; i += 1) {
          const ev = events[i];
          if (ev.beat > currentBeat) break;
          // 88% visual hold gives a clean visible lift between repeated consecutive strikes
          const visualEnd = ev.beat + Math.max(0.08, ev.dur * 0.88);
          if (currentBeat < visualEnd) {
            if (ev.hand === 'RH') nextRH.add(ev.midi);
            else nextLH.add(ev.midi);
          }
        }

        const changed = new Set();
        state.autoRHActive.forEach((m) => { if (!nextRH.has(m)) changed.add(m); });
        nextRH.forEach((m) => { if (!state.autoRHActive.has(m)) changed.add(m); });
        state.autoLHActive.forEach((m) => { if (!nextLH.has(m)) changed.add(m); });
        nextLH.forEach((m) => { if (!state.autoLHActive.has(m)) changed.add(m); });

        state.autoRHActive = nextRH;
        state.autoLHActive = nextLH;
        changed.forEach((midi) => syncKeyVisual(midi));
      }

      /** Main requestAnimationFrame loop combining audio lookahead & visual sync. */
      function playbackTick(nowMs) {
        if (!state.isPlaying) return;

        const song = getSelectedSong();
        if (!song) {
          pauseSong();
          return;
        }

        const dtSec = Math.min(0.1, Math.max(0, (nowMs - state.lastFrameTimeMs) / 1000));
        state.lastFrameTimeMs = nowMs;

        const bps = getSongBeatsPerSec(song);
        state.songPosBeats += dtSec * bps;

        // 1. Schedule upcoming audio events within LOOKAHEAD_SEC on Web Audio clock
        const lookaheadBeats = LOOKAHEAD_SEC * bps;
        const audioNow = Tone.now();
        while (
          state.nextScheduleIdx < song.events.length &&
          song.events[state.nextScheduleIdx].beat <= state.songPosBeats + lookaheadBeats
        ) {
          const ev = song.events[state.nextScheduleIdx];
          const delaySec = Math.max(0, (ev.beat - state.songPosBeats) / bps);
          const durSec = Math.max(0.06, (ev.dur / bps) * 0.94);
          audioTriggerScheduled(ev.note, durSec, audioNow + delaySec, ev.vel);
          state.nextScheduleIdx += 1;
        }

        // 2. Sync visual key highlights & progress bar
        syncAutoVisualsForBeat(song, state.songPosBeats);
        updateProgressUI();

        // 3. Finish cleanly at the end of the song
        if (state.songPosBeats >= song.totalBeats) {
          state.isPlaying = false;
          state.rafId = null;
          state.songPosBeats = song.totalBeats;
          clearAutoHighlights();
          updateProgressUI();
          updateTransportUI();
          return;
        }

        state.rafId = requestAnimationFrame(playbackTick);
      }

      /** Finds the first event index at or after targetBeat. */
      function findScheduleIndexForBeat(song, targetBeat) {
        let idx = 0;
        while (idx < song.events.length && song.events[idx].beat < targetBeat - 1e-4) {
          idx += 1;
        }
        return idx;
      }

      function startSongPlayback() {
        let song = getSelectedSong();
        if (!song) {
          selectSong(SONGS[0].id, true);
          return;
        }

        ensureAudioStarted();

        // Ensure keyboard is displaying the full song range when playing
        if (state.rangeMode !== 'song') {
          state.rangeMode = 'song';
          renderAdaptiveKeyboard();
        }

        // If at the end, restart from beginning
        if (state.songPosBeats >= song.totalBeats - 0.05) {
          state.songPosBeats = 0;
        }

        state.nextScheduleIdx = findScheduleIndexForBeat(song, state.songPosBeats);
        state.isPlaying = true;
        state.lastFrameTimeMs = performance.now();
        updateTransportUI();

        if (state.rafId !== null) cancelAnimationFrame(state.rafId);
        state.rafId = requestAnimationFrame(playbackTick);
      }

      function pauseSong() {
        state.isPlaying = false;
        if (state.rafId !== null) {
          cancelAnimationFrame(state.rafId);
          state.rafId = null;
        }
        silenceAllAudio();
        clearAutoHighlights();
        updateTransportUI();
      }

      function stopSong() {
        pauseSong();
        state.songPosBeats = 0;
        state.nextScheduleIdx = 0;
        updateProgressUI();
        updateTransportUI();
      }

      function seekSongToRatio(ratio) {
        const song = getSelectedSong();
        if (!song) return;

        const clamped = Math.max(0, Math.min(1, ratio));
        const wasPlaying = state.isPlaying;

        silenceAllAudio();
        clearAutoHighlights();

        state.songPosBeats = clamped * song.totalBeats;
        state.nextScheduleIdx = findScheduleIndexForBeat(song, state.songPosBeats);
        state.lastFrameTimeMs = performance.now();

        if (wasPlaying) {
          syncAutoVisualsForBeat(song, state.songPosBeats);
        }
        updateProgressUI();
        updateTransportUI();
      }

      function selectSong(songId, autoStart = true) {
        ensureAudioStarted();

        // Clicking the already-selected song toggles Play/Pause cleanly
        if (state.selectedSongId === songId && state.rangeMode === 'song') {
          if (state.isPlaying) {
            pauseSong();
          } else {
            startSongPlayback();
          }
          return;
        }

        // Switch cleanly to new song
        pauseSong();
        cancelChordSamplePlayback();
        state.selectedSongId = songId;
        state.songPosBeats = 0;
        state.nextScheduleIdx = 0;
        state.rangeMode = 'song';

        renderSongPillsState();
        renderAdaptiveKeyboard();
        updateProgressUI();
        updateTransportUI();

        // Gently center the scroll area on narrow mobile screens
        requestAnimationFrame(() => {
          const maxScroll = dom.pianoScroll.scrollWidth - dom.pianoScroll.clientWidth;
          if (maxScroll > 0) {
            dom.pianoScroll.scrollLeft = Math.round(maxScroll * 0.45);
          }
        });

        if (autoStart) {
          startSongPlayback();
        }
      }

      function returnToFreePlay() {
        pauseSong();
        state.rangeMode = 'free';
        state.selectedSongId = null;
        state.songPosBeats = 0;
        state.nextScheduleIdx = 0;
        renderSongPillsState();
        renderAdaptiveKeyboard();
        updateProgressUI();
        updateTransportUI();
      }

      /**
       * Picks a sample song at random — never the one already selected — and
       * starts it from the top.
       */
      function playRandomSong() {
        ensureAudioStarted();
        if (!SONGS.length) return;

        const others = SONGS.filter((song) => song.id !== state.selectedSongId);
        const pool = others.length ? others : SONGS;
        const pick = pool[Math.floor(Math.random() * pool.length)];

        // Re-picking the current song would toggle pause, so rewind it first.
        if (pick.id === state.selectedSongId) stopSong();

        selectSong(pick.id, true);
      }

      /* =========================================================================
       * 9. SONG PILLS, SPEED SELECTOR & CHORD HELPER UI
       * ========================================================================= */

      function renderSongPills() {
        dom.songPills.innerHTML = '';
        SONGS.forEach((song) => {
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.textContent = song.title;
          btn.addEventListener('click', () => {
            selectSong(song.id, true);
            btn.blur();
          });
          dom.songPills.appendChild(btn);
          dom.songPillById.set(song.id, btn);
        });
        renderSongPillsState();
      }

      function renderSongPillsState() {
        SONGS.forEach((song) => {
          const btn = dom.songPillById.get(song.id);
          const isSelected = song.id === state.selectedSongId;
          btn.setAttribute('aria-pressed', String(isSelected));
          if (isSelected) {
            btn.className = [
              'px-3 py-1.5 rounded-xl text-xs sm:text-sm font-semibold border transition cursor-pointer select-none',
              'bg-[#4E94BE] border-[#3A7BA3] text-[#F8F6F2] shadow-[0_2px_8px_rgba(78,148,190,0.28)] active:scale-95',
            ].join(' ');
          } else {
            btn.className = [
              'px-3 py-1.5 rounded-xl text-xs sm:text-sm font-medium border transition cursor-pointer select-none',
              'bg-[#F1EDE4] border-[#E5DFD3] text-[#2D2B28] hover:bg-[#E8E2D6] active:scale-95',
            ].join(' ');
          }
        });
      }

      function renderSpeedButtons() {
        dom.speedGroup.innerHTML = '';
        SPEED_OPTIONS.forEach((spd) => {
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.textContent = `${spd}x`;
          btn.addEventListener('click', () => {
            state.playbackSpeed = spd;
            updateSpeedButtonsUI();
            updateProgressUI();
            btn.blur();
          });
          dom.speedGroup.appendChild(btn);
          dom.speedBtnByVal.set(spd, btn);
        });
        updateSpeedButtonsUI();
      }

      function updateSpeedButtonsUI() {
        SPEED_OPTIONS.forEach((spd) => {
          const btn = dom.speedBtnByVal.get(spd);
          const active = spd === state.playbackSpeed;
          btn.setAttribute('aria-pressed', String(active));
          btn.className = active
            ? 'px-2 py-1 rounded-lg text-xs font-semibold bg-[#FAF8F4] text-[#2D2B28] shadow-[0_1px_3px_rgba(45,43,40,0.12)] transition cursor-pointer'
            : 'px-2 py-1 rounded-lg text-xs font-medium text-[#726D65] hover:text-[#2D2B28] transition cursor-pointer';
        });
      }

      function renderChordPills() {
        dom.chordPills.innerHTML = '';
        CHORDS.forEach((chord) => {
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.textContent = chord.label;
          btn.addEventListener('click', () => {
            ensureAudioStarted();
            cancelChordSamplePlayback();
            state.selectedChordId = state.selectedChordId === chord.id ? null : chord.id;
            updateChordUI();
            btn.blur();
          });
          dom.chordPills.appendChild(btn);
          dom.chordPillById.set(chord.id, btn);
        });
        updateChordUI();
      }

      function recomputeChordHighlights() {
        const prev = new Set(state.chordHighlight);
        state.chordHighlight.clear();

        const activeChord = CHORDS.find((c) => c.id === state.selectedChordId) || null;
        if (activeChord) {
          const anchor = getAnchorBaseMidi();
          activeChord.offsets.forEach((off) => state.chordHighlight.add(anchor + off));
        }

        prev.forEach((m) => syncKeyVisual(m));
        state.chordHighlight.forEach((m) => syncKeyVisual(m));

        // Update readout text
        if (!activeChord) {
          dom.chordReadout.textContent = '';
          dom.chordReadout.classList.add('opacity-0');
        } else {
          const anchor = getAnchorBaseMidi();
          dom.chordReadout.textContent = activeChord.offsets.map((off) => midiToNote(anchor + off)).join(' · ');
          dom.chordReadout.classList.remove('opacity-0');
        }
      }

      function updateChordUI() {
        const hasSelection = Boolean(state.selectedChordId);
        dom.playChordBtn.disabled = !hasSelection;
        dom.clearChordBtn.disabled = !hasSelection;

        CHORDS.forEach((chord) => {
          const btn = dom.chordPillById.get(chord.id);
          const isSelected = chord.id === state.selectedChordId;
          btn.setAttribute('aria-pressed', String(isSelected));
          if (isSelected) {
            btn.className = [
              'px-2.5 sm:px-3 py-1.5 rounded-xl text-xs sm:text-sm font-semibold border transition cursor-pointer select-none',
              'bg-[#E28C4D] border-[#C97335] text-[#F8F6F2] shadow-[0_2px_8px_rgba(226,140,77,0.28)] active:scale-95',
            ].join(' ');
          } else {
            btn.className = [
              'px-2.5 sm:px-3 py-1.5 rounded-xl text-xs sm:text-sm font-medium border transition cursor-pointer select-none',
              'bg-[#F1EDE4] border-[#E5DFD3] text-[#2D2B28] hover:bg-[#E8E2D6] active:scale-95',
            ].join(' ');
          }
        });

        recomputeChordHighlights();
      }

      function cancelChordSamplePlayback() {
        state.chordSampleTimers.forEach((t) => clearTimeout(t));
        state.chordSampleTimers = [];
        Array.from(state.sourceToMidi.keys())
          .filter((id) => id.startsWith('chord:'))
          .forEach((id) => releaseManualSource(id));
      }

      function playSelectedChordSample() {
        const activeChord = CHORDS.find((c) => c.id === state.selectedChordId);
        if (!activeChord) return;

        ensureAudioStarted();
        cancelChordSamplePlayback();

        const anchor = getAnchorBaseMidi();
        const rollDelayMs = 28;
        const holdMs = 950;

        activeChord.offsets.forEach((off, idx) => {
          const midi = anchor + off;
          const sourceId = `chord:${idx}`;
          const t1 = setTimeout(() => pressManualMidi(sourceId, midi, 0.78), idx * rollDelayMs);
          const t2 = setTimeout(() => releaseManualSource(sourceId), idx * rollDelayMs + holdMs);
          state.chordSampleTimers.push(t1, t2);
        });
      }

      /* =========================================================================
       * 10. MULTI-INPUT EVENT HANDLING (Pointer Multi-Touch, Mouse, Keyboard)
       * ========================================================================= */

      function getMidiFromElement(el) {
        if (!el) return null;
        const keyBtn = el.closest('[data-midi]');
        if (!keyBtn || !dom.pianoBed.contains(keyBtn)) return null;
        return Number(keyBtn.dataset.midi);
      }

      function setupPointerEvents() {
        dom.pianoBed.addEventListener('pointerdown', (e) => {
          if (e.pointerType === 'mouse' && e.button !== 0) return;
          const midi = getMidiFromElement(e.target);
          if (midi === null) return;

          e.preventDefault();
          ensureAudioStarted();

          state.activePointers.set(e.pointerId, midi);
          pressManualMidi(`ptr:${e.pointerId}`, midi);
        });

        // Smooth mouse glissando & multi-touch slide tracking
        dom.pianoBed.addEventListener('pointermove', (e) => {
          if (!state.activePointers.has(e.pointerId)) return;

          const elUnder = document.elementFromPoint(e.clientX, e.clientY);
          const nextMidi = getMidiFromElement(elUnder);
          const prevMidi = state.activePointers.get(e.pointerId);
          if (nextMidi === prevMidi) return;

          const sourceId = `ptr:${e.pointerId}`;
          if (nextMidi === null) {
            releaseManualSource(sourceId);
            state.activePointers.delete(e.pointerId);
          } else {
            state.activePointers.set(e.pointerId, nextMidi);
            pressManualMidi(sourceId, nextMidi);
          }
        });

        const endPointer = (e) => {
          if (!state.activePointers.has(e.pointerId)) return;
          releaseManualSource(`ptr:${e.pointerId}`);
          state.activePointers.delete(e.pointerId);
        };

        dom.pianoBed.addEventListener('pointerleave', (e) => {
          if (e.pointerType === 'mouse') endPointer(e);
        });
        window.addEventListener('pointerup', endPointer);
        window.addEventListener('pointercancel', endPointer);
      }

      function setupKeyboardEvents() {
        window.addEventListener('keydown', (e) => {
          if (e.ctrlKey || e.metaKey || e.altKey || e.repeat) return;
          if (e.target && e.target.tagName === 'INPUT') return;

          const offset = CODE_TO_OFFSET.get(e.code);
          if (offset === undefined) return;

          e.preventDefault();
          ensureAudioStarted();
          pressManualMidi(`kbd:${e.code}`, getAnchorBaseMidi() + offset);
        });

        window.addEventListener('keyup', (e) => {
          if (!CODE_TO_OFFSET.has(e.code)) return;
          releaseManualSource(`kbd:${e.code}`);
        });

        window.addEventListener('blur', () => {
          releaseAllManualInputs();
        });
      }

      /* =========================================================================
       * 11. CONTROLS & PROGRESS BAR WIRING
       * ========================================================================= */

      function applyVolumeUI() {
        const effective = state.isMuted ? 0 : state.volumePercent;
        dom.volumeSlider.value = String(effective);
        dom.volumeValue.textContent = `${effective}%`;
        dom.volWave1.style.opacity = effective > 0 ? '1' : '0.18';
        dom.volWave2.style.opacity = effective >= 50 ? '1' : '0.18';
        dom.muteBtn.classList.toggle('text-[#E28C4D]', effective === 0);

        if (masterVolume) {
          if (effective === 0) {
            masterVolume.mute = true;
          } else {
            masterVolume.mute = false;
            masterVolume.volume.rampTo(percentToDb(effective), 0.04);
          }
        }
      }

      function applySustainUI() {
        dom.sustainBtn.setAttribute('aria-pressed', String(state.sustainOn));
        if (state.sustainOn) {
          dom.sustainBtn.classList.remove('bg-[#F1EDE4]', 'border-[#E5DFD3]', 'text-[#2D2B28]', 'hover:bg-[#EAE4D9]');
          dom.sustainBtn.classList.add('bg-[#4E94BE]', 'border-[#3A7BA3]', 'text-[#F8F6F2]', 'hover:bg-[#3A7BA3]');
          dom.sustainDot.classList.remove('bg-[#B5ADA0]');
          dom.sustainDot.classList.add('bg-[#F8F6F2]');
        } else {
          dom.sustainBtn.classList.remove('bg-[#4E94BE]', 'border-[#3A7BA3]', 'text-[#F8F6F2]', 'hover:bg-[#3A7BA3]');
          dom.sustainBtn.classList.add('bg-[#F1EDE4]', 'border-[#E5DFD3]', 'text-[#2D2B28]', 'hover:bg-[#EAE4D9]');
          dom.sustainDot.classList.remove('bg-[#F8F6F2]');
          dom.sustainDot.classList.add('bg-[#B5ADA0]');
        }
      }

      function applyLabelsUI() {
        dom.pianoBed.classList.toggle('labels-hidden', !state.showLabels);
        dom.labelsBtn.setAttribute('aria-pressed', String(state.showLabels));
        dom.labelsIconOn.classList.toggle('hidden', !state.showLabels);
        dom.labelsIconOff.classList.toggle('hidden', state.showLabels);

        if (state.showLabels) {
          dom.labelsBtn.classList.remove('bg-[#F1EDE4]', 'border-[#E5DFD3]', 'text-[#726D65]', 'hover:bg-[#EAE4D9]');
          dom.labelsBtn.classList.add('border-[#4E94BE]/40', 'bg-[#4E94BE]/12', 'text-[#295975]', 'hover:bg-[#4E94BE]/20');
        } else {
          dom.labelsBtn.classList.remove('border-[#4E94BE]/40', 'bg-[#4E94BE]/12', 'text-[#295975]', 'hover:bg-[#4E94BE]/20');
          dom.labelsBtn.classList.add('bg-[#F1EDE4]', 'border-[#E5DFD3]', 'text-[#726D65]', 'hover:bg-[#EAE4D9]');
        }
      }

      function setupControlEvents() {
        // Octave Shift Down / Up
        dom.octaveDownBtn.addEventListener('click', () => {
          ensureAudioStarted();
          if (state.octaveShift <= MIN_OCTAVE_SHIFT) return;
          releaseAllManualInputs();
          state.octaveShift -= 1;
          renderAdaptiveKeyboard();
          dom.octaveDownBtn.blur();
        });

        dom.octaveUpBtn.addEventListener('click', () => {
          ensureAudioStarted();
          if (state.octaveShift >= MAX_OCTAVE_SHIFT) return;
          releaseAllManualInputs();
          state.octaveShift += 1;
          renderAdaptiveKeyboard();
          dom.octaveUpBtn.blur();
        });

        // Volume & Mute
        dom.volumeSlider.addEventListener('input', (e) => {
          ensureAudioStarted();
          const val = Number(e.target.value);
          state.volumePercent = val;
          if (val > 0) {
            state.isMuted = false;
            state.lastNonZeroVolume = val;
          } else {
            state.isMuted = true;
          }
          applyVolumeUI();
        });

        dom.muteBtn.addEventListener('click', () => {
          ensureAudioStarted();
          if (state.isMuted || state.volumePercent === 0) {
            state.isMuted = false;
            state.volumePercent = state.lastNonZeroVolume || 82;
          } else {
            state.lastNonZeroVolume = state.volumePercent;
            state.isMuted = true;
          }
          applyVolumeUI();
          dom.muteBtn.blur();
        });

        // Sustain Toggle
        dom.sustainBtn.addEventListener('click', () => {
          ensureAudioStarted();
          state.sustainOn = !state.sustainOn;
          if (!state.sustainOn) flushSustainedNotes();
          applySustainUI();
          dom.sustainBtn.blur();
        });

        // Note Labels Toggle
        dom.labelsBtn.addEventListener('click', () => {
          state.showLabels = !state.showLabels;
          applyLabelsUI();
          dom.labelsBtn.blur();
        });

        // Random Song Shortcut
        dom.randomBtn.addEventListener('click', () => {
          playRandomSong();
          dom.randomBtn.blur();
        });

        // Sample Song Transport Controls
        dom.songPlayBtn.addEventListener('click', () => {
          ensureAudioStarted();
          if (state.isPlaying) {
            pauseSong();
          } else {
            startSongPlayback();
          }
          dom.songPlayBtn.blur();
        });

        dom.songStopBtn.addEventListener('click', () => {
          stopSong();
          dom.songStopBtn.blur();
        });

        dom.freePlayBtn.addEventListener('click', () => {
          returnToFreePlay();
          dom.freePlayBtn.blur();
        });

        // Interactive Click & Drag Progress Bar Seeking
        const ratioFromClientX = (clientX) => {
          const rect = dom.progressTrack.getBoundingClientRect();
          if (rect.width <= 0) return 0;
          return Math.max(0, Math.min(1, (clientX - rect.left) / rect.width));
        };

        dom.progressTrack.addEventListener('pointerdown', (e) => {
          if (!getSelectedSong()) return;
          e.preventDefault();
          ensureAudioStarted();
          state.isSeeking = true;
          dom.progressTrack.setPointerCapture(e.pointerId);
          seekSongToRatio(ratioFromClientX(e.clientX));
        });

        dom.progressTrack.addEventListener('pointermove', (e) => {
          if (!state.isSeeking) return;
          seekSongToRatio(ratioFromClientX(e.clientX));
        });

        const endSeek = (e) => {
          if (!state.isSeeking) return;
          state.isSeeking = false;
          if (dom.progressTrack.hasPointerCapture(e.pointerId)) {
            dom.progressTrack.releasePointerCapture(e.pointerId);
          }
        };
        dom.progressTrack.addEventListener('pointerup', endSeek);
        dom.progressTrack.addEventListener('pointercancel', endSeek);

        // Chord Helper Actions
        dom.clearChordBtn.addEventListener('click', () => {
          cancelChordSamplePlayback();
          state.selectedChordId = null;
          updateChordUI();
          dom.clearChordBtn.blur();
        });

        dom.playChordBtn.addEventListener('click', () => {
          playSelectedChordSample();
          dom.playChordBtn.blur();
        });

        // Update scroll hint smoothly on resize
        window.addEventListener('resize', updateMobileScrollHint);

        // First-gesture Web Audio unlock safety net
        ['pointerdown', 'keydown'].forEach((evt) => {
          window.addEventListener(evt, ensureAudioStarted, { once: true, passive: true });
        });
      }

      /* =========================================================================
       * 12. BOOTSTRAP
       * ========================================================================= */

      function init() {
        renderSongPills();
        renderSpeedButtons();
        renderChordPills();
        renderAdaptiveKeyboard();
        applyVolumeUI();
        applySustainUI();
        applyLabelsUI();
        updateProgressUI();
        updateTransportUI();
        initAudioEngine();
        setupPointerEvents();
        setupKeyboardEvents();
        setupControlEvents();
      }

      init();
    })();
  </script>
</body>
</html>
