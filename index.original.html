<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Virtual Piano</title>

  <!-- Inter Font for clean minimalist legibility -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'],
          },
        },
      },
    };
  </script>

  <!-- Tone.js v14.8.49 via CDN for Salamander Grand Piano Sampler & Reverb -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>

  <style>
    /* Eye-friendly warm palette: strictly zero #FFFFFF and zero #000000 */
    :root {
      --bg-canvas: #F3F0E9;
      --bg-card: #FAF8F4;
      --bg-subtle: #F1EDE4;
      --border-soft: #E5DFD3;
      --text-primary: #2D2B28;
      --text-secondary: #726D65;

      --white-key: #FCFBF8;
      --white-key-hover: #F5F1E9;
      --white-key-border: #DDD6C9;
      --white-key-lip: #D6CEBF;

      --black-key: #302E2B;
      --black-key-top: #3E3B37;
      --black-key-bevel: #22201E;

      /* Ocean-Blue: Manual press & Auto-Play Right-Hand melody */
      --ocean-white: #4E94BE;
      --ocean-white-top: #4589B3;
      --ocean-white-lip: #387296;
      --ocean-black: #3A7BA3;
      --ocean-black-top: #4688B0;
      --ocean-black-bevel: #2C6182;

      /* Warm Orange: Chord Helper & Auto-Play Left-Hand accompaniment */
      --orange-white: #E28C4D;
      --orange-white-top: #D98142;
      --orange-white-lip: #B8672D;
      --orange-black: #C97335;
      --orange-black-top: #D68143;
      --orange-black-bevel: #A15824;

      /* Soft passive tint for Chord Helper guide */
      --chord-white-tint: #F7E1CE;
      --chord-white-lip: #E28C4D;
      --chord-black-tint: #B86A33;
      --chord-black-bevel: #915123;

      --press-text: #F8F6F2;
    }

    * {
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-canvas);
      color: var(--text-primary);
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      overflow-x: hidden;
    }

    /* Custom subtle horizontal scrollbar for expanded keyboards on narrow screens */
    .piano-scroll {
      scrollbar-width: thin;
      scrollbar-color: #CFC7B8 #ECE7DD;
    }
    .piano-scroll::-webkit-scrollbar {
      height: 7px;
    }
    .piano-scroll::-webkit-scrollbar-track {
      background: #ECE7DD;
      border-radius: 9999px;
    }
    .piano-scroll::-webkit-scrollbar-thumb {
      background: #CFC7B8;
      border-radius: 9999px;
    }

    /* Multi-touch safe keyboard surface */
    .piano-bed {
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }

    /* ================= WHITE KEYS ================= */
    .key-white {
      background: linear-gradient(180deg, #F7F4ED 0%, var(--white-key) 12%, var(--white-key) 100%);
      border-right: 1px solid var(--white-key-border);
      border-bottom: 5px solid var(--white-key-lip);
      box-shadow: inset 0 1px 0 rgba(252, 251, 248, 0.92), 0 2px 3px rgba(45, 43, 40, 0.05);
      transition: background 60ms ease-out, transform 50ms ease-out, border-bottom-width 50ms ease-out, box-shadow 60ms ease-out;
      will-change: transform, background;
    }

    .key-white:last-child {
      border-right: none;
    }

    @media (hover: hover) {
      .key-white:not(.is-manual):not(.is-auto-rh):not(.is-auto-lh):not(.is-chord):hover {
        background: var(--white-key-hover);
      }
    }

    /* Priority 4: Chord Helper guide (passive soft warm orange tint) */
    .key-white.is-chord {
      background: linear-gradient(180deg, #F4D8BE 0%, var(--chord-white-tint) 100%);
      border-bottom-color: var(--chord-white-lip);
    }
    .key-white.is-chord .key-note-label {
      color: #8F4918;
      font-weight: 600;
    }
    .key-white.is-chord .key-shortcut-label {
      color: #A45721;
    }

    /* Priority 3: Auto-Play Left Hand (solid warm orange + depression) */
    .key-white.is-auto-lh {
      background: linear-gradient(180deg, var(--orange-white-top) 0%, var(--orange-white) 100%);
      border-bottom-width: 2px;
      border-bottom-color: var(--orange-white-lip);
      transform: translateY(2.5px);
      box-shadow: inset 0 2px 5px rgba(45, 43, 40, 0.16);
    }
    .key-white.is-auto-lh .key-note-label,
    .key-white.is-auto-lh .key-shortcut-label {
      color: var(--press-text);
    }

    /* Priority 2 & 1: Auto-Play Right Hand & Manual Press (solid ocean-blue + depression) */
    .key-white.is-auto-rh,
    .key-white.is-manual {
      background: linear-gradient(180deg, var(--ocean-white-top) 0%, var(--ocean-white) 100%);
      border-bottom-width: 2px;
      border-bottom-color: var(--ocean-white-lip);
      transform: translateY(2.5px);
      box-shadow: inset 0 2px 5px rgba(45, 43, 40, 0.16);
    }
    .key-white.is-auto-rh .key-note-label,
    .key-white.is-auto-rh .key-shortcut-label,
    .key-white.is-manual .key-note-label,
    .key-white.is-manual .key-shortcut-label {
      color: var(--press-text);
    }

    /* ================= BLACK KEYS ================= */
    .key-black {
      background: linear-gradient(180deg, var(--black-key-top) 0%, var(--black-key) 82%, #282623 100%);
      border-bottom: 6px solid var(--black-key-bevel);
      border-left: 1px solid #403D39;
      border-right: 1px solid #242220;
      box-shadow: 0 5px 10px -2px rgba(45, 43, 40, 0.36), inset 0 1px 0 rgba(250, 248, 244, 0.14);
      transition: background 60ms ease-out, transform 50ms ease-out, border-bottom-width 50ms ease-out, box-shadow 60ms ease-out;
      will-change: transform, background;
    }

    @media (hover: hover) {
      .key-black:not(.is-manual):not(.is-auto-rh):not(.is-auto-lh):not(.is-chord):hover {
        background: linear-gradient(180deg, #484440 0%, #383532 82%, #2C2A27 100%);
      }
    }

    /* Priority 4: Chord Helper guide on black key */
    .key-black.is-chord {
      background: linear-gradient(180deg, #CA783D 0%, var(--chord-black-tint) 100%);
      border-bottom-color: var(--chord-black-bevel);
      border-left-color: #D88A52;
      border-right-color: #9A5524;
    }
    .key-black.is-chord .key-note-label,
    .key-black.is-chord .key-shortcut-label {
      color: var(--press-text);
    }

    /* Priority 3: Auto-Play Left Hand on black key */
    .key-black.is-auto-lh {
      background: linear-gradient(180deg, var(--orange-black-top) 0%, var(--orange-black) 100%);
      border-bottom-width: 2px;
      border-bottom-color: var(--orange-black-bevel);
      border-left-color: #DE8E54;
      border-right-color: #A55B26;
      transform: translateY(3px);
      box-shadow: 0 2px 4px rgba(45, 43, 40, 0.26), inset 0 1px 3px rgba(45, 43, 40, 0.18);
    }
    .key-black.is-auto-lh .key-note-label,
    .key-black.is-auto-lh .key-shortcut-label {
      color: var(--press-text);
    }

    /* Priority 2 & 1: Auto-Play Right Hand & Manual Press on black key */
    .key-black.is-auto-rh,
    .key-black.is-manual {
      background: linear-gradient(180deg, var(--ocean-black-top) 0%, var(--ocean-black) 100%);
      border-bottom-width: 2px;
      border-bottom-color: var(--ocean-black-bevel);
      border-left-color: #5498C2;
      border-right-color: #2D6283;
      transform: translateY(3px);
      box-shadow: 0 2px 4px rgba(45, 43, 40, 0.26), inset 0 1px 3px rgba(45, 43, 40, 0.18);
    }
    .key-black.is-auto-rh .key-note-label,
    .key-black.is-auto-rh .key-shortcut-label,
    .key-black.is-manual .key-note-label,
    .key-black.is-manual .key-shortcut-label {
      color: var(--press-text);
    }

    /* Chord guide indicator dot */
    .chord-dot {
      opacity: 0;
      transform: scale(0.4);
      transition: opacity 140ms ease, transform 160ms cubic-bezier(0.22, 1, 0.36, 1);
    }
    .is-chord .chord-dot {
      opacity: 1;
      transform: scale(1);
    }

    /* Smooth hide/show of note names for memory practice */
    .labels-hidden .key-note-label {
      opacity: 0;
      transform: translateY(2px);
      pointer-events: none;
    }
    .key-note-label {
      transition: opacity 140ms ease, transform 140ms ease, color 60ms ease;
    }

    /* Minimalist warm volume slider */
    input[type="range"].warm-slider {
      -webkit-appearance: none;
      appearance: none;
      background: transparent;
      cursor: pointer;
    }
    input[type="range"].warm-slider::-webkit-slider-runnable-track {
      height: 6px;
      border-radius: 9999px;
      background: #E2DBD0;
    }
    input[type="range"].warm-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 15px;
      height: 15px;
      border-radius: 9999px;
      background: #4E94BE;
      border: 2px solid #FAF8F4;
      box-shadow: 0 1px 4px rgba(45, 43, 40, 0.22);
      margin-top: -4.5px;
      transition: transform 120ms ease, background-color 120ms ease;
    }
    input[type="range"].warm-slider:hover::-webkit-slider-thumb {
      transform: scale(1.1);
      background: #3A7BA3;
    }
    input[type="range"].warm-slider::-moz-range-track {
      height: 6px;
      border-radius: 9999px;
      background: #E2DBD0;
    }
    input[type="range"].warm-slider::-moz-range-thumb {
      width: 15px;
      height: 15px;
      border-radius: 9999px;
      background: #4E94BE;
      border: 2px solid #FAF8F4;
      box-shadow: 0 1px 4px rgba(45, 43, 40, 0.22);
      transition: transform 120ms ease, background-color 120ms ease;
    }

    /* Soft loading dot pulse */
    @keyframes softPulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.42; transform: scale(0.84); }
    }
    .dot-pulse {
      animation: softPulse 1.3s ease-in-out infinite;
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-2.5 sm:p-4 md:p-6 antialiased selection:bg-[#4E94BE]/20">

  <!-- Centered Minimalist Workspace (No Headers, Banners, or Footers) -->
  <main class="w-full max-w-6xl flex flex-col gap-2.5 sm:gap-3.5">

    <!-- 1. Top Compact Control Bar Card -->
    <section
      aria-label="Piano Controls"
      class="bg-[#FAF8F4] border border-[#E5DFD3] rounded-2xl px-3.5 py-2.5 sm:px-5 sm:py-3 shadow-[0_6px_22px_-8px_rgba(45,43,40,0.07)] flex flex-wrap items-center justify-between gap-2.5"
    >
      <!-- Left: Status Pill + Octave Shift -->
      <div class="flex flex-wrap items-center gap-2 sm:gap-3">
        <!-- Audio Readiness Status -->
        <div
          id="status-pill"
          role="status"
          aria-live="polite"
          class="inline-flex items-center gap-2 px-3 py-1.5 rounded-full bg-[#F1EDE4] border border-[#E5DFD3] text-xs font-medium text-[#726D65] select-none"
        >
          <span id="status-dot" class="w-2 h-2 rounded-full bg-[#E28C4D] dot-pulse"></span>
          <span id="status-text">Loading Piano…</span>
        </div>

        <span class="hidden sm:inline-block w-px h-5 bg-[#E5DFD3]" aria-hidden="true"></span>

        <!-- Octave Shift (-2 to +2) -->
        <div class="inline-flex items-center gap-1 bg-[#F1EDE4] border border-[#E5DFD3] rounded-xl p-1" title="Shift keyboard octave">
          <button
            id="octave-down"
            type="button"
            aria-label="Shift octave down"
            class="w-7 h-7 rounded-lg flex items-center justify-center text-[#2D2B28] bg-[#FAF8F4] border border-[#E5DFD3] hover:bg-[#ECE7DD] active:scale-95 disabled:opacity-40 disabled:pointer-events-none transition cursor-pointer"
          >
            <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round">
              <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
          </button>

          <div class="px-2 text-center min-w-[66px] select-none">
            <span id="octave-readout" class="text-xs sm:text-sm font-semibold tracking-tight text-[#2D2B28]">C4 – B5</span>
          </div>

          <button
            id="octave-up"
            type="button"
            aria-label="Shift octave up"
            class="w-7 h-7 rounded-lg flex items-center justify-center text-[#2D2B28] bg-[#FAF8F4] border border-[#E5DFD3] hover:bg-[#ECE7DD] active:scale-95 disabled:opacity-40 disabled:pointer-events-none transition cursor-pointer"
          >
            <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round">
              <line x1="12" y1="5" x2="12" y2="19"></line>
              <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
          </button>
        </div>
      </div>

      <!-- Right: Random Song + Volume + Sustain + Note Names Toggle -->
      <div class="flex flex-wrap items-center gap-2 sm:gap-2.5">
        <!-- Random Song Shortcut -->
        <button
          id="random-btn"
          type="button"
          title="Play a random song"
          aria-label="Play a random song"
          class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-xl text-xs sm:text-sm font-medium border border-[#E28C4D]/45 bg-[#E28C4D]/12 text-[#8A4F1C] hover:bg-[#E28C4D]/22 active:scale-[0.98] transition cursor-pointer select-none"
        >
          <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="16 3 21 3 21 8"></polyline>
            <line x1="4" y1="20" x2="21" y2="3"></line>
            <polyline points="21 16 21 21 16 21"></polyline>
            <line x1="15" y1="15" x2="21" y2="21"></line>
            <line x1="4" y1="4" x2="9" y2="9"></line>
          </svg>
          <span>Random</span>
        </button>

        <!-- Volume Slider & Quick Mute -->
        <div class="inline-flex items-center gap-2 bg-[#F1EDE4] border border-[#E5DFD3] rounded-xl px-2.5 py-1.5">
          <button
            id="mute-btn"
            type="button"
            aria-label="Toggle mute"
            title="Mute / Unmute"
            class="text-[#726D65] hover:text-[#2D2B28] transition cursor-pointer p-0.5 rounded"
          >
            <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
              <path id="vol-wave-1" d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
              <path id="vol-wave-2" d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
            </svg>
          </button>
          <input
            id="volume-slider"
            type="range"
            min="0"
            max="100"
            value="82"
            aria-label="Master volume"
            class="warm-slider w-20 sm:w-24"
          />
          <span id="volume-value" class="text-xs font-medium tabular-nums text-[#726D65] w-8 text-right select-none">82%</span>
        </div>

        <!-- Sustain Pedal Toggle -->
        <button
          id="sustain-btn"
          type="button"
          aria-pressed="false"
          class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-xl text-xs sm:text-sm font-medium border border-[#E5DFD3] bg-[#F1EDE4] text-[#2D2B28] hover:bg-[#EAE4D9] active:scale-[0.98] transition cursor-pointer select-none"
        >
          <span id="sustain-dot" class="w-2 h-2 rounded-full bg-[#B5ADA0] transition-colors"></span>
          <span>Sustain</span>
        </button>

        <!-- Note Labels Toggle -->
        <button
          id="labels-btn"
          type="button"
          aria-pressed="true"
          class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-xl text-xs sm:text-sm font-medium border border-[#4E94BE]/40 bg-[#4E94BE]/12 text-[#295975] hover:bg-[#4E94BE]/20 active:scale-[0.98] transition cursor-pointer select-none"
        >
          <svg id="labels-icon-on" class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
            <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"></path>
            <circle cx="12" cy="12" r="3"></circle>
          </svg>
          <svg id="labels-icon-off" class="w-3.5 h-3.5 hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 19c-7 0-11-7-11-7a18.45 18.45 0 0 1 5.06-5.94"></path>
            <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 7 11 7a18.5 18.5 0 0 1-2.16 3.19"></path>
            <line x1="1" y1="1" x2="23" y2="23"></line>
          </svg>
          <span>Notes</span>
        </button>
      </div>
    </section>

    <!-- 2. Sample Songs Auto-Play Card -->
    <section
      aria-label="Sample Piano Songs"
      class="bg-[#FAF8F4] border border-[#E5DFD3] rounded-2xl px-3.5 py-3 sm:px-5 sm:py-3.5 shadow-[0_6px_22px_-8px_rgba(45,43,40,0.07)] flex flex-col gap-3"
    >
      <!-- Top Row: Song Selection Pills + Visible Range Indicator / Free Play Switch -->
      <div class="flex flex-wrap items-center justify-between gap-2.5">
        <div class="flex flex-wrap items-center gap-1.5 sm:gap-2">
          <span class="text-xs font-semibold uppercase tracking-wider text-[#726D65] mr-1 select-none">Songs</span>
          <div id="song-pills" class="flex flex-wrap items-center gap-1.5" role="group" aria-label="Sample songs">
            <!-- Song pills injected by JS -->
          </div>
        </div>

        <!-- Active Range Pill + Quick Return to 2-Octave Free Play -->
        <div class="flex items-center gap-2 ml-auto">
          <span
            id="visible-range-pill"
            class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-lg bg-[#F1EDE4] border border-[#E5DFD3] text-xs font-medium text-[#726D65] select-none"
          >
            <span class="w-1.5 h-1.5 rounded-full bg-[#4E94BE]"></span>
            <span id="visible-range-text">C4 – B5</span>
          </span>

          <button
            id="free-play-btn"
            type="button"
            class="hidden px-2.5 py-1 rounded-lg text-xs font-medium bg-[#FAF8F4] border border-[#D8D0C2] text-[#2D2B28] hover:bg-[#EFEAE0] active:scale-95 transition cursor-pointer select-none"
          >
            Free Play (2 Octaves)
          </button>
        </div>
      </div>

      <!-- Bottom Row: Transport (Play/Pause, Stop) + Speed + Seekable Progress Bar + Legend -->
      <div class="flex flex-wrap items-center gap-2.5 sm:gap-3 pt-2.5 border-t border-[#ECE7DD]">
        <!-- Play / Pause & Stop -->
        <div class="inline-flex items-center gap-1.5">
          <button
            id="song-play-btn"
            type="button"
            class="inline-flex items-center gap-1.5 px-3.5 py-1.5 rounded-xl text-xs sm:text-sm font-medium text-[#F8F6F2] bg-[#4E94BE] hover:bg-[#3A7BA3] active:scale-[0.98] shadow-[0_2px_8px_rgba(78,148,190,0.28)] transition cursor-pointer select-none"
          >
            <svg id="play-icon" class="w-3.5 h-3.5 fill-current" viewBox="0 0 24 24">
              <path d="M8 5.14v13.72a1 1 0 0 0 1.52.85l11.02-6.86a1 1 0 0 0 0-1.7L9.52 4.29A1 1 0 0 0 8 5.14z"></path>
            </svg>
            <svg id="pause-icon" class="w-3.5 h-3.5 fill-current hidden" viewBox="0 0 24 24">
              <rect x="6" y="5" width="4.5" height="14" rx="1.2"></rect>
              <rect x="13.5" y="5" width="4.5" height="14" rx="1.2"></rect>
            </svg>
            <span id="song-play-label">Play</span>
          </button>

          <button
            id="song-stop-btn"
            type="button"
            aria-label="Stop playback"
            title="Stop"
            disabled
            class="inline-flex items-center justify-center w-8 h-8 rounded-xl bg-[#F1EDE4] border border-[#E5DFD3] text-[#2D2B28] hover:bg-[#E8E2D6] active:scale-95 disabled:opacity-40 disabled:pointer-events-none transition cursor-pointer"
          >
            <svg class="w-3.5 h-3.5 fill-current" viewBox="0 0 24 24">
              <rect x="6" y="6" width="12" height="12" rx="2"></rect>
            </svg>
          </button>
        </div>

        <!-- Speed Selector -->
        <div
          id="speed-group"
          role="group"
          aria-label="Playback speed"
          class="inline-flex items-center bg-[#F1EDE4] border border-[#E5DFD3] rounded-xl p-0.5 select-none"
        >
          <!-- Speed buttons injected by JS -->
        </div>

        <!-- Interactive Seekable Progress Bar + Time Readout -->
        <div class="flex-1 min-w-[180px] flex items-center gap-2.5">
          <div
            id="progress-track"
            role="slider"
            tabindex="0"
            aria-label="Song progress"
            aria-valuemin="0"
            aria-valuemax="100"
            aria-valuenow="0"
            class="relative flex-1 h-6 flex items-center cursor-pointer group select-none"
          >
            <div class="w-full h-2 rounded-full bg-[#E6E0D5] overflow-hidden">
              <div
                id="progress-fill"
                class="h-full w-0 rounded-full bg-gradient-to-r from-[#4E94BE] to-[#3A7BA3] transition-[width] duration-75"
              ></div>
            </div>
            <div
              id="progress-thumb"

  <script>
    (() => {
      'use strict';

      /* =========================================================================
       * 1. MUSICAL UTILITIES & CONSTANTS
       * ========================================================================= */

      const NOTE_NAMES = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
      const IS_BLACK_PC = [false, true, false, true, false, false, true, false, true, false, true, false];

      // Authentic horizontal offset of each black key relative to its preceding white key's right edge
      const BLACK_OFFSET_BY_PC = {

        3:  0.06, // D#

      // Salamander Grand Piano samples across A1..C7

        'C5': 'C5.mp3',  'D#5': 'Ds5.mp3', 'F#5': 'Fs5.mp3', 'A5': 'A5.mp3',
        'C6': 'C6.mp3',  'D#6': 'Ds6.mp3', 'F#6': 'Fs6.mp3', 'A6': 'A6.mp3',

      // Computer keyboard mapping across 2 octaves (semitone offset 0..23 from active anchor octave)

        { offset: 0,  code: 'KeyZ',   label: 'Z' },
        { offset: 1,  code: 'KeyS',   label: 'S' },
        { offset: 2,  code: 'KeyX',   label: 'X' },
        { offset: 3,  code: 'KeyD',   label: 'D' },
        { offset: 4,  code: 'KeyC',   label: 'C' },

        { offset: 9,  code: 'KeyN',   label: 'N' },
        { offset: 10, code: 'KeyJ',   label: 'J' },
        { offset: 11, code: 'KeyM',   label: 'M' },
        { offset: 12, code: 'KeyQ',   label: 'Q' },
        { offset: 13, code: 'Digit2', label: '2' },
        { offset: 14, code: 'KeyW',   label: 'W' },
        { offset: 15, code: 'Digit3', label: '3' },

        { offset: 17, code: 'KeyR',   label: 'R' },
        { offset: 18, code: 'Digit5', label: '5' },
        { offset: 19, code: 'KeyT',   label: 'T' },
        { offset: 20, code: 'Digit6', label: '6' },
        { offset: 21, code: 'KeyY',   label: 'Y' },

      const CODE_TO_OFFSET = new Map(KEYBOARD_MAP.map((item) => [item.code, item.offset]));
      const OFFSET_TO_LABEL = new Map(KEYBOARD_MAP.map((item) => [item.offset, item.label]));

      // Basic Chord Helper definitions (semitone offsets from active anchor C)
      const CHORDS = [
        { id: 'C',    label: 'C',    offsets: [0, 4, 7] },
        { id: 'Dm',   label: 'Dm',   offsets: [2, 5, 9] },
        { id: 'Em',   label: 'Em',   offsets: [4, 7, 11] },
        { id: 'F',    label: 'F',    offsets: [5, 9, 12] },
        { id: 'G',    label: 'G',    offsets: [7, 11, 14] },
        { id: 'Am',   label: 'Am',   offsets: [9, 12, 16] },
        { id: 'Bdim', label: 'Bdim', offsets: [11, 14, 17] },
        { id: 'G7',   label: 'G7',   offsets: [7, 11, 14, 17] },
      ];

      const SPEED_OPTIONS = [0.5, 0.75, 1, 1.25];
      const DEFAULT_BASE_OCTAVE = 4; // C4 – B5
      const MIN_OCTAVE_SHIFT = -2;   // C2 – B3
      const MAX_OCTAVE_SHIFT = 2;    // C6 – B7

      /** Converts a MIDI number (e.g., 60) to scientific pitch notation (e.g., "C4"). */
      function midiToNote(midi) {
        const pitch = NOTE_NAMES[((midi % 12) + 12) % 12];
        const octave = Math.floor(midi / 12) - 1;
        return `${pitch}${octave}`;
      }

      /** Converts pitch notation (e.g., "F#3", "Bb4") to MIDI note number. */
      function noteToMidi(noteStr) {
        const match = /^([A-Ga-g])([#b]?)(-?\d+)$/.exec(noteStr.trim());
        if (!match) throw new Error(`Invalid note: ${noteStr}`);
        const baseMap = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 };
        let pc = baseMap[match[1].toUpperCase()];
        if (match[2] === '#') pc += 1;
        if (match[2] === 'b') pc -= 1;
        const octave = parseInt(match[3], 10);
        return (octave + 1) * 12 + pc;
      }

      function isBlackMidi(midi) {
        return IS_BLACK_PC[((midi % 12) + 12) % 12];
      }

      /** Formats seconds as M:SS. */
      function formatTime(totalSeconds) {
        const clamped = Math.max(0, Math.floor(totalSeconds));
        const mins = Math.floor(clamped / 60);
        const secs = clamped % 60;
        return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
      }

      /* =========================================================================
       * 2. SAMPLE SONGS LIBRARY (5 Complete Two-Hand Arrangements)
       * ========================================================================= */

      /**
       * Helper to compile a song definition into sorted MIDI events and compute
       * exact white-key-aligned lowest & highest visible MIDI bounds.
       */
      function buildSong(id, title, bpm, composerFn) {
        const rawEvents = [];

        // Push a single note or chord array
        const add = (beat, notes, dur, hand, vel = hand === 'RH' ? 0.80 : 0.62) => {
          const list = Array.isArray(notes) ? notes : [notes];
          list.forEach((n) => {
            if (!n) return;
            const midi = noteToMidi(n);
            rawEvents.push({
              beat,
              dur,
              midi,
              note: midiToNote(midi),
              hand,
              vel,
            });
          });
        };

        // Push a sequential melody phrase of [noteOrChordOrNull, durationInBeats, optionalVel]
        const seq = (startBeat, items, hand, defaultVel = hand === 'RH' ? 0.82 : 0.62) => {
          let cursor = startBeat;
          items.forEach(([notes, dur, vel]) => {
            if (notes !== null) {
              add(cursor, notes, dur, hand, vel ?? defaultVel);
            }
            cursor += dur;
          });
          return cursor;
        };

        composerFn({ add, seq });

        // Stable chronological sort (bass/LH first on identical beats)
        rawEvents.sort((a, b) => {
          if (Math.abs(a.beat - b.beat) > 1e-6) return a.beat - b.beat;
          if (a.hand !== b.hand) return a.hand === 'LH' ? -1 : 1;
          return a.midi - b.midi;
        });

        let minMidi = Infinity;
        let maxMidi = -Infinity;
        let totalBeats = 0;

        rawEvents.forEach((ev, idx) => {
          ev.id = idx;
          if (ev.midi < minMidi) minMidi = ev.midi;
          if (ev.midi > maxMidi) maxMidi = ev.midi;
          const endBeat = ev.beat + ev.dur;
          if (endBeat > totalBeats) totalBeats = endBeat;
        });

        // Snap lowest and highest range boundaries cleanly onto natural/white keys
        let rangeMinMidi = minMidi;
        let rangeMaxMidi = maxMidi;
        if (isBlackMidi(rangeMinMidi)) rangeMinMidi -= 1;
        if (isBlackMidi(rangeMaxMidi)) rangeMaxMidi += 1;

        return {
          id,
          title,
          bpm,
          events: rawEvents,
          totalBeats,
          rangeMinMidi,
          rangeMaxMidi,
        };
      }

      /* ---- Arrangement helpers shared by all songs ---- */
      const transposeNote = (n, semis) => (semis ? midiToNote(noteToMidi(n) + semis) : n);

      /** Chord tones (pitch classes `pcs`) below note `n`, at least a minor third apart, never under `floor`. */
      const chordTonesBelow = (n, pcs, count = 1, floor = 60) => {
        const out = [];
        let m = noteToMidi(n) - 3;
        while (out.length < count && m >= floor) {
          if (pcs.includes(((m % 12) + 12) % 12)) {
            out.push(midiToNote(m));
            m -= 3;
          } else {
            m -= 1;
          }
        }
        return out;
      };

      /** Melody sequencer with optional octave shift and automatic chord-tone harmony. */
      const makeMelody = (add) => (start, items, opt = {}) => {
        const { oct = 0, harm = 0, pcsAt = null, floor = 60, vel = 0.82, hand = 'RH' } = opt;
        let t = start;
        items.forEach(([n, d, v]) => {
          if (n !== null && n !== undefined) {
            const list = (Array.isArray(n) ? n : [n]).map((x) => transposeNote(x, oct));
            if (harm && pcsAt && list.length === 1) {
              list.push(...chordTonesBelow(list[0], pcsAt(t), harm, floor));
            }
            add(t, list, d, hand, v ?? vel);
          }
          t += d;
        });
        return t;
      };

        ];

        // Var 12: sparkling arpeggios

          'C#5', 'E5', 'A5', 'C#6', 'A5', 'E5', 'C#5', 'E5',

      /**

      const SONG_BELLA_CIAO = buildSong('bella-ciao', 'Bella Ciao', 118, ({ add }) => {

        const CH = {

          A7: { b1: 'A2', b2: 'E3', tri: ['E3', 'G3', 'C#4'], pcs: [9, 1, 4, 7] },
          Dm: { b1: 'D3', b2: 'A2', tri: ['F3', 'A3', 'D4'], pcs: [2, 5, 9] },
          E:  { b1: 'E2', b2: 'B2', tri: ['G#3', 'B3', 'D4'], pcs: [4, 8, 11, 2] },
        };

        const lhBar = (s, c, style, v) => {
          const ch = CH[c];
          if (style === 'sustain') {

            add(s + 0.1, ch.tri, 3.6, 'LH', v - 0.04);
          } else if (style === 'arp') {
            add(s, ch.b1, 1.9, 'LH', v + 0.06);
            add(s + 0.5, ch.tri[0], 0.45, 'LH', v);
            add(s + 1.0, ch.tri[1], 0.45, 'LH', v);
            add(s + 1.5, ch.tri[2], 0.45, 'LH', v - 0.02);
            add(s + 2.0, ch.b2, 0.45, 'LH', v + 0.04);
            add(s + 2.5, ch.tri[0], 0.45, 'LH', v);
            add(s + 3.0, ch.tri[1], 0.45, 'LH', v);
            add(s + 3.5, ch.tri[2], 0.45, 'LH', v - 0.02);
          } else if (style === 'drive') {
            add(s, ch.b1, 0.9, 'LH', v + 0.08);
            add(s + 1, ch.tri, 0.45, 'LH', v);
            add(s + 1.5, ch.tri, 0.45, 'LH', v - 0.04);
            add(s + 2, ch.b2, 0.9, 'LH', v + 0.06);
            add(s + 3, ch.tri, 0.45, 'LH', v);
            add(s + 3.5, ch.tri, 0.45, 'LH', v - 0.04);
          } else { // oom-pah
            add(s + 0, ch.b1, 0.85, 'LH', v + 0.06);
            add(s + 1, ch.tri, 0.55, 'LH', v - 0.03);
            add(s + 2, ch.b2, 0.85, 'LH', v + 0.02);
            add(s + 3, ch.tri, 0.55, 'LH', v - 0.04);

        const BARS = [
          ['Am', [['C5', 0.5], ['A4', 2.0], ['E4', 0.5], ['A4', 0.5], ['B4', 0.5]]],
          ['Am', [['C5', 0.5], ['A4', 2.0], ['E4', 0.5], ['A4', 0.5], ['B4', 0.5]]],
          ['Am', [['C5', 1.0], ['B4', 0.5], ['A4', 0.5], ['C5', 1.0], ['B4', 0.5], ['A4', 0.5]]],

          ['Dm', [['F5', 0.5], ['F5', 2.0], ['F5', 0.5], ['E5', 0.5], ['D5', 0.5]]],
          ['Am', [['F5', 0.5], ['E5', 2.0], ['E5', 0.5], ['D5', 0.5], ['C5', 0.5]]],

          ['Am', [['A4', 2.0], [null, 2.0]]],

        // One verse (or its last line when fromBar = 4). Pickup notes go before `s`.

      const SONG_WEDDING_MARCH = buildSong('wedding-march', 'Wedding March', 120, ({ add, seq }) => {

        const episode = (s) => {

            [['F2', ['F3', 'A3', 'C4'], 'C3'], [5, 9, 0], [['A4', 1.5], ['B4', 0.5], ['C5', 1], ['D5', 1]]],
            [['G2', ['F3', 'G3', 'B3'], 'D3'], [7, 11, 2, 5], [['B4', 1.5], ['A4', 0.5], ['G4', 1], ['F4', 1]]],

            [['G2', ['F3', 'G3', 'B3'], 'D3'], [7, 11, 2, 5], [['B4', 1], ['D5', 1], ['G5', 1], ['F5', 1]]],

      /**

      const SONG_ODE_TO_JOY = buildSong('ode-to-joy', 'Ode to Joy', 112, ({ add }) => {

        const CH = {
          C:  { r: 'C3', dy: ['C3', 'G3'], tri: ['C3', 'E3', 'G3'], alb: ['C3', 'G3', 'E3', 'G3'], pcs: [0, 4, 7] },

          ['E4', 1], ['E4', 1], ['F4', 1], ['G4', 1], ['G4', 1], ['F4', 1], ['E4', 1], ['D4', 1],
          ['C4', 1], ['C4', 1], ['D4', 1], ['E4', 1], ['E4', 1.5], ['D4', 0.5], ['D4', 2],
        ];
        const A2 = [
          ['E4', 1], ['E4', 1], ['F4', 1], ['G4', 1], ['G4', 1], ['F4', 1], ['E4', 1], ['D4', 1],
          ['C4', 1], ['C4', 1], ['D4', 1], ['E4', 1], ['D4', 1.5], ['C4', 0.5], ['C4', 2],
        ];
        const B = [
          ['D4', 1], ['D4', 1], ['E4', 1], ['C4', 1], ['D4', 1], ['E4', 0.5], ['F4', 0.5], ['E4', 1], ['C4', 1],
          ['D4', 1], ['E4', 0.5], ['F4', 0.5], ['E4', 1], ['D4', 1], ['C4', 1], ['D4', 1], ['G3', 2],
        ];
        const A_CH  = ['C', 'C', 'G', 'G7', 'C', 'C', 'G', 'G'];
        const A2_CH = ['C', 'C', 'G', 'G7', 'C', 'C', 'G', 'C'];
        const B_CH  = ['G', 'C', 'G', 'C', 'G', 'G', 'C', 'G'];

        const phrase = (s, notes, chords, o) => {
          chords.forEach((c, i) => {
            const ch = CH[c];
            const b = s + i * 2;
            const v = o.lhVel;
            if (o.lh === 'alb') {
              ch.alb.forEach((n, k) => add(b + k * 0.5, n, 0.45, 'LH', v + (k === 0 ? 0.04 : 0)));

              add(b, ch.tri, 1.9, 'LH', v);
            } else if (o.lh === 'oct') {
              add(b, [ch.r, transposeNote(ch.r, 12)], 1.9, 'LH', v + 0.06);
              add(b + 1, ch.tri.slice(1), 0.9, 'LH', v - 0.04);
            } else {
              add(b, ch.dy, 1.9, 'LH', v);
            }
          });
          const pcsAt = (t) => CH[chords[Math.min(7, Math.floor((t - s + 1e-6) / 2))]].pcs;
          mel(s, notes, { oct: o.oct || 0, harm: o.harm || 0, pcsAt, floor: 60, vel: o.vel });
          return s + 16;
        };

        let t = 0;
        // Theme
        t = phrase(t, A,  A_CH,  { lh: 'dyad', vel: 0.80, lhVel: 0.54 });
        t = phrase(t, A2, A2_CH, { lh: 'dyad', vel: 0.82, lhVel: 0.56 });
        t = phrase(t, B,  B_CH,  { lh: 'tri',  vel: 0.82, lhVel: 0.56 });
        t = phrase(t, A2, A2_CH, { lh: 'alb',  vel: 0.84, lhVel: 0.56 });
        t = phrase(t, B,  B_CH,  { lh: 'alb',  vel: 0.82, lhVel: 0.56, harm: 1 });
        t = phrase(t, A2, A2_CH, { lh: 'alb',  vel: 0.84, lhVel: 0.58, harm: 1 });
        // Upper-octave variation
        t = phrase(t, A,  A_CH,  { lh: 'alb', oct: 12, harm: 1, vel: 0.84, lhVel: 0.58 });
        t = phrase(t, A2, A2_CH, { lh: 'alb', oct: 12, harm: 1, vel: 0.86, lhVel: 0.58 });
        t = phrase(t, B,  B_CH,  { lh: 'tri', oct: 12, harm: 1, vel: 0.84, lhVel: 0.60 });
        t = phrase(t, A2, A2_CH, { lh: 'oct', oct: 12, harm: 2, vel: 0.88, lhVel: 0.62 });
        // Finale
        t = phrase(t, B,  B_CH,  { lh: 'oct', oct: 12, harm: 2, vel: 0.90, lhVel: 0.64 });
        t = phrase(t, A2, A2_CH, { lh: 'oct', oct: 12, harm: 2, vel: 0.92, lhVel: 0.66 });

        // Closing flourish
        add(t, ['C3', 'G3', 'C4'], 3.8, 'LH', 0.72);
        mel(t, [['G4', 0.25], ['C5', 0.25], ['E5', 0.25], ['G5', 0.25], [['E5', 'G5', 'C6'], 3.2]], { vel: 0.90 });
      });

      /**
       * 5) Jingle Bells — James Lord Pierpont (C Major, 136 BPM) — FULL VERSION
       * Intro, chorus, verse 1, chorus (upper octave), verse 2 (upper octave),
       * harmonized chorus and big final chorus with festive outro (~2:55).
       */
      const SONG_JINGLE_BELLS = buildSong('jingle-bells', 'Jingle Bells', 136, ({ add }) => {
        const mel = makeMelody(add);
        const C_CHORD = ['E3', 'G3', 'C4'];
        const F_CHORD = ['F3', 'A3', 'C4'];
        const G7_CHORD = ['F3', 'G3', 'B3'];
        const CH = {
          C:  { b1: 'C3', b2: 'G2', big: ['C2', 'C3'], tri: C_CHORD, pcs: [0, 4, 7] },
          F:  { b1: 'F2', b2: 'C3', big: ['F2', 'F3'], tri: F_CHORD, pcs: [5, 9, 0] },
          G7: { b1: 'G2', b2: 'D3', big: ['G2', 'G3'], tri: G7_CHORD, pcs: [7, 11, 2, 5] },
        };

        const oomPah = (s, bass1, chord, bass2, v) => {
          add(s + 0, bass1, 0.85, 'LH', v + 0.06);
          add(s + 1, chord, 0.55, 'LH', v - 0.04);
          add(s + 2, bass2, 0.85, 'LH', v + 0.04);
          add(s + 3, chord, 0.55, 'LH', v - 0.04);
        };

        // Lower chord voicings keep the keys under a low-register melody free
        const VOICINGS = {
          full:   { C: C_CHORD, F: F_CHORD, G7: G7_CHORD },
          chorus: { C: ['E3', 'G3'], F: ['F3', 'A3'], G7: G7_CHORD },
          verse:  { C: ['C3', 'E3'], F: ['C3', 'F3'], G7: ['F3', 'G3'] },
        };
        const lhBar = (s, c, big, v, voicing = 'full') => {
          const V = VOICINGS[voicing];
          const cTri = V.C;
          if (c === 'END') {
            add(s, big ? CH.C.big : 'C3', 0.85, 'LH', v + 0.06);
            add(s + 1, cTri, 0.55, 'LH', v - 0.02);
            add(s + 2, ['C3', 'G3'], 1.8, 'LH', v + 0.06);
          } else if (c === 'CG') {
            add(s, big ? CH.C.big : 'C3', 0.85, 'LH', v + 0.02);
            add(s + 1, cTri, 0.55, 'LH', v - 0.04);
            add(s + 2, 'G2', 0.85, 'LH', v + 0.04);
            add(s + 3, V.G7, 0.55, 'LH', v);
          } else {
            const ch = CH[c];
            oomPah(s, big ? ch.big : ch.b1, V[c], ch.b2, v);
          }
        };

        const pcsFor = (chords, s) => (t) => {
          const rel = t - s + 1e-6;
          const c = chords[Math.min(15, Math.floor(rel / 4))];
          if (c === 'END') return CH.C.pcs;
          if (c === 'CG') return (rel % 4) < 2 ? CH.C.pcs : CH.G7.pcs;
          return CH[c].pcs;
        };

        const CHORUS = [
          ['E4', 1.0], ['E4', 1.0], ['E4', 2.0],
          ['E4', 1.0], ['E4', 1.0], ['E4', 2.0],
          ['E4', 1.0], ['G4', 1.0], ['C4', 1.5], ['D4', 0.5],
          ['E4', 3.6], [null, 0.4],
          ['F4', 1.0], ['F4', 1.0], ['F4', 1.0], ['F4', 1.0],
          ['F4', 1.0], ['E4', 1.0], ['E4', 1.0], ['E4', 0.5], ['E4', 0.5],
          ['D4', 1.0], ['D4', 1.0], ['E4', 1.0], ['D4', 1.0],
          ['G4', 2.0], [null, 1.0], ['G4', 1.0],
          ['E4', 1.0], ['E4', 1.0], ['E4', 2.0],
          ['E4', 1.0], ['E4', 1.0], ['E4', 2.0],
          ['E4', 1.0], ['G4', 1.0], ['C4', 1.5], ['D4', 0.5],
          ['E4', 3.6], [null, 0.4],
          ['F4', 1.0], ['F4', 1.0], ['F4', 1.0], ['F4', 1.0],
          ['F4', 1.0], ['E4', 1.0], ['E4', 1.0], ['E4', 0.5], ['E4', 0.5],
          ['G4', 1.0], ['G4', 1.0], ['F4', 1.0], ['D4', 1.0],
          ['C4', 3.6], [null, 0.4],
        ];

        const cE = ['G4', 'C5', 'E5'];
        const cG = ['B4', 'D5', 'G5'];
        const cC = ['E4', 'G4', 'C5'];
        const cD = ['F4', 'A4', 'D5'];
        const cF = ['A4', 'C5', 'F5'];
        const cB = ['F4', 'B4', 'D5'];
        const CHORUS_H = [
          [cE, 1.0], [cE, 1.0], [cE, 2.0],
          [cE, 1.0], [cE, 1.0], [cE, 2.0],
          [cE, 1.0], [cG, 1.0], [cC, 1.5], [cD, 0.5],
          [cE, 3.6], [null, 0.4],
          [cF, 1.0], [cF, 1.0], [cF, 1.0], [cF, 1.0],
          [cF, 1.0], [cE, 1.0], [cE, 1.0], [cE, 0.5], [cE, 0.5],
          [cB, 1.0], [cB, 1.0], [cE, 1.0], [cB, 1.0],
          [cG, 2.0], [null, 1.0], [cG, 1.0],
          [cE, 1.0], [cE, 1.0], [cE, 2.0],
          [cE, 1.0], [cE, 1.0], [cE, 2.0],
          [cE, 1.0], [cG, 1.0], [cC, 1.5], [cD, 0.5],
          [cE, 3.6], [null, 0.4],
          [cF, 1.0], [cF, 1.0], [cF, 1.0], [cF, 1.0],
          [cF, 1.0], [cE, 1.0], [cE, 1.0], [cE, 0.5], [cE, 0.5],
          [cG, 1.0], [cG, 1.0], [cF, 1.0], [cB, 1.0],
          [['E5', 'G5', 'C6'], 3.6], [null, 0.4],
        ];

        const VERSE = [
          ['G3', 1.0], ['E4', 1.0], ['D4', 1.0], ['C4', 1.0],
          ['G3', 2.5], [null, 0.5], ['G3', 0.5], ['G3', 0.5],
          ['E4', 1.0], ['D4', 1.0], ['C4', 1.0], ['A3', 1.0],
          ['A3', 3.0], [null, 1.0],
          ['A3', 1.0], ['F4', 1.0], ['E4', 1.0], ['D4', 1.0],
          ['B3', 3.0], [null, 1.0],
          ['G4', 1.0], ['G4', 1.0], ['F4', 1.0], ['D4', 1.0],
          ['E4', 3.0], [null, 1.0],
          ['G3', 1.0], ['E4', 1.0], ['D4', 1.0], ['C4', 1.0],
          ['G3', 2.5], [null, 0.5], ['G3', 0.5], ['G3', 0.5],
          ['E4', 1.0], ['D4', 1.0], ['C4', 1.0], ['A3', 1.0],
          ['A3', 3.0], [null, 1.0],
          ['A3', 1.0], ['F4', 1.0], ['E4', 1.0], ['D4', 1.0],
          ['G4', 1.0], ['G4', 1.0], ['G4', 1.0], ['G4', 1.0],
          ['A4', 1.0], ['G4', 1.0], ['F4', 1.0], ['D4', 1.0],
          ['C4', 2.0], [null, 0.5], ['G4', 1.5, 0.88],
        ];

        const CHORUS_CH = ['C', 'C', 'C', 'C', 'F', 'C', 'G7', 'G7', 'C', 'C', 'C', 'C', 'F', 'C', 'G7', 'END'];
        const VERSE_CH  = ['C', 'C', 'C', 'F', 'F', 'G7', 'G7', 'C', 'C', 'C', 'C', 'F', 'F', 'G7', 'G7', 'CG'];

        const section = (s, melody, chords, o) => {
          chords.forEach((c, i) => lhBar(s + i * 4, c, o.big, o.lhVel, o.oct ? 'full' : (melody === VERSE ? 'verse' : (melody === CHORUS ? 'chorus' : 'full'))));
          mel(s, melody, { oct: o.oct || 0, harm: o.harm || 0, pcsAt: pcsFor(chords, s), floor: 62, vel: o.vel });
          return s + 64;
        };

        // ---- Sleigh-bell intro (4 beats) ----
        add(0, ['C3', 'G3'], 3.6, 'LH', 0.62);
        add(0.0, 'E5', 0.4, 'RH', 0.85);
        add(0.5, 'G5', 0.4, 'RH', 0.85);
        add(1.0, 'E5', 0.4, 'RH', 0.85);
        add(1.5, 'G5', 0.4, 'RH', 0.85);
        add(2.0, ['C5', 'E5'], 0.9, 'RH', 0.88);
        add(3.0, ['D5', 'G5'], 0.9, 'RH', 0.88);

        let t = 4;
        t = section(t, CHORUS,   CHORUS_CH, { vel: 0.82, lhVel: 0.58 });
        t = section(t, VERSE,    VERSE_CH,  { vel: 0.80, lhVel: 0.54 });
        t = section(t, CHORUS,   CHORUS_CH, { oct: 12, harm: 1, vel: 0.84, lhVel: 0.60 });
        t = section(t, VERSE,    VERSE_CH,  { oct: 12, harm: 1, vel: 0.82, lhVel: 0.56 });
        t = section(t, CHORUS_H, CHORUS_CH, { vel: 0.88, lhVel: 0.62 });
        t = section(t, CHORUS_H, CHORUS_CH, { big: true, vel: 0.92, lhVel: 0.66 });

        // ---- Festive outro & chimes ----
        add(t, ['C2', 'G2', 'C3'], 3.8, 'LH', 0.74);
        add(t, ['C5', 'E5', 'G5', 'C6'], 1.8, 'RH', 0.94);
        add(t + 2.0, 'E5', 0.45, 'RH', 0.86);
        add(t + 2.5, 'G5', 0.45, 'RH', 0.88);
        add(t + 3.0, ['C5', 'E5', 'G5', 'C6'], 1.0, 'RH', 0.95);
      });

      const SONGS = [
        SONG_CANON_IN_D,
        SONG_BELLA_CIAO,
        SONG_WEDDING_MARCH,
        SONG_ODE_TO_JOY,
        SONG_JINGLE_BELLS,
      ];

      /* =========================================================================
       * 3. APPLICATION STATE
       * ========================================================================= */

      const state = {
        // Keyboard & controls
        octaveShift: 0,
        rangeMode: 'free', // 'free' (2 octaves) | 'song' (auto-expanded to song bounds)
        visibleMinMidi: 60, // C4
        visibleMaxMidi: 83, // B5
        volumePercent: 82,
        lastNonZeroVolume: 82,
        isMuted: false,
        sustainOn: false,
        showLabels: true,

        // Chord helper
        selectedChordId: null,
        chordSampleTimers: [],

        // Audio status
        audioUnlocked: false,
        samplerLoaded: false,
        usingFallbackSynth: false,

        // Independent key highlight layers (zero conflicts or stuck visual states)
        manualActive: new Map(),     // midi -> Set<sourceId>
        autoRHActive: new Set(),     // Set<midi>
        autoLHActive: new Set(),     // Set<midi>
        chordHighlight: new Set(),   // Set<midi>

        // Manual voice & sustain tracking
        sourceToMidi: new Map(),     // sourceId -> midi
        manualHoldCount: new Map(),  // midi -> active hold count
        sustainedMidis: new Set(),   // midi notes ringing under Sustain pedal
        activePointers: new Map(),   // pointerId -> midi

        // Sample song auto-play scheduler state
        selectedSongId: null,
        isPlaying: false,
        playbackSpeed: 1,
        songPosBeats: 0,
        nextScheduleIdx: 0,
        lastFrameTimeMs: 0,
        rafId: null,
        isSeeking: false,
      };

      /* =========================================================================
       * 4. DOM REFERENCES
       * ========================================================================= */

      const dom = {
        statusDot: document.getElementById('status-dot'),
        statusText: document.getElementById('status-text'),
        octaveDownBtn: document.getElementById('octave-down'),
        octaveUpBtn: document.getElementById('octave-up'),
        octaveReadout: document.getElementById('octave-readout'),
        muteBtn: document.getElementById('mute-btn'),
        volWave1: document.getElementById('vol-wave-1'),
        volWave2: document.getElementById('vol-wave-2'),
        volumeSlider: document.getElementById('volume-slider'),
        volumeValue: document.getElementById('volume-value'),
        sustainBtn: document.getElementById('sustain-btn'),
        sustainDot: document.getElementById('sustain-dot'),
        labelsBtn: document.getElementById('labels-btn'),

        labelsIconOff: document.getElementById('labels-icon-off'),
        randomBtn: document.getElementById('random-btn'),

        songPills: document.getElementById('song-pills'),
        visibleRangeText: document.getElementById('visible-range-text'),
        freePlayBtn: document.getElementById('free-play-btn'),
        songPlayBtn: document.getElementById('song-play-btn'),
        playIcon: document.getElementById('play-icon'),
        pauseIcon: document.getElementById('pause-icon'),
        songPlayLabel: document.getElementById('song-play-label'),
